name: Vexora CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vexora.slnx

      - name: Build
        run: dotnet build Vexora.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Vexora.slnx --configuration Release --no-build --verbosity normal
